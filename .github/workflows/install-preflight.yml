name: Existing Jarvis Installer Preflight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source-only checks without installing or contacting accounts
        run: python -m unittest discover -s tests -p test_install_preflight.py -v
